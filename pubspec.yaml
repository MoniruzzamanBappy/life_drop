name: lifedrop
description: "Donate a drop, save a life."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_messaging: ^16.2.2

  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  google_sign_in: 6.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"

flutter_native_splash:
  color: "#F7FFFD"
  image: assets/logo.png

  android: true
  ios: true
  web: true

  android_12:
    color: "#F7FFFD"
    image: assets/logo.png
    icon_background_color: "#F7FFFD"
